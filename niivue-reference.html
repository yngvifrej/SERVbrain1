<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NiiVue cortical loading reference</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Helvetica,Arial,sans-serif}
#gl{width:100%;height:100%;display:block}
.note{position:fixed;left:20px;bottom:16px;font-size:12px;color:#707070;text-transform:uppercase;letter-spacing:.02em}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="note">NiiVue ICBM152 cortical mesh reference · drag to rotate</div>

<script type="module">
import {{ Niivue }} from "https://cdn.jsdelivr.net/npm/@niivue/niivue@0.69.0/+esm";

const nv = new Niivue({
  dragAndDropEnabled: false,
  backColor: [1,1,1,1],
  show3Dcrosshair: false
});

await nv.attachToCanvas(document.getElementById("gl"));

await nv.loadMeshes([
  {
    url: "https://niivue.github.io/niivue-demo-images/BrainMesh_ICBM152.lh.mz3",
    name: "BrainMesh_ICBM152.lh.mz3"
  },
  {
    url: "https://niivue.github.io/niivue-demo-images/BrainMesh_ICBM152.rh.mz3",
    name: "BrainMesh_ICBM152.rh.mz3"
  }
]);
</script>
</body>
</html>
